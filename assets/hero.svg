<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Imran Shaikh — Penetration Tester, Bug Hunter, Cybersecurity Researcher</title>
  <desc id="heroDesc">An animated terminal window with a glitch name plate and a boot sequence.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050706"/>
      <stop offset=".55" stop-color="#06100b"/>
      <stop offset="1" stop-color="#030504"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08140e"/>
      <stop offset=".5" stop-color="#050c08"/>
      <stop offset="1" stop-color="#040806"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00ff9c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="72%">
      <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".62"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff9c" stroke-opacity=".045" stroke-width="1"/>
    </pattern>

    <pattern id="matrix" width="64" height="160" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <animateTransform attributeName="patternTransform" type="translate" from="0 -160" to="0 160" dur="9s" repeatCount="indefinite"/>
      <text x="6" y="18" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#00ff9c" fill-opacity=".16">0</text>
      <text x="34" y="46" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#00ff9c" fill-opacity=".09">1</text>
      <text x="14" y="76" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#00ff9c" fill-opacity=".13">1</text>
      <text x="46" y="104" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#00ff9c" fill-opacity=".07">0</text>
      <text x="24" y="132" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#00ff9c" fill-opacity=".12">01</text>
    </pattern>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity=".26"/>
    </pattern>

    <clipPath id="windowClip">
      <rect x="24" y="24" width="1152" height="432" rx="14"/>
    </clipPath>

    <clipPath id="gA"><rect x="58" y="128" width="410" height="12"/></clipPath>
    <clipPath id="gB"><rect x="58" y="220" width="410" height="10"/></clipPath>
    <clipPath id="gC"><rect x="58" y="252" width="410" height="14"/></clipPath>

  </defs>

  <style>
    .mono { font-family: "Fira Code", "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Menlo, Consolas, monospace; }
    .name { font-family: "Fira Code", "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 2px; }
    .line { opacity: 1; animation: boot .45s cubic-bezier(.22,1,.36,1) both; }
    .d1 { animation-delay: .55s; }
    .d2 { animation-delay: .7s; }
    .d3 { animation-delay: .85s; }
    .d4 { animation-delay: 1s; }
    .d5 { animation-delay: 1.15s; }
    .d6 { animation-delay: 1.3s; }
    .d7 { animation-delay: 1.45s; }
    .d8 { animation-delay: 1.6s; }
    .d9 { animation-delay: 1.75s; }
    .glitchA { opacity: 0; animation: glitchA 5.6s steps(1) infinite; }
    .glitchB { opacity: 0; animation: glitchB 6.4s steps(1) infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    .scanline { animation: scan 7s linear infinite; }
    @keyframes boot { from { transform: translateY(6px); } to { transform: translateY(0); } }
    @keyframes glitchA { 0%, 91%, 100% { opacity: 0; transform: translate(0,0); } 92% { opacity: .55; transform: translate(-4px,1px); } 93% { opacity: .55; transform: translate(3px,-1px); } 94% { opacity: .55; transform: translate(-2px,0); } 95% { opacity: .55; transform: translate(0,0); } }
    @keyframes glitchB { 0%, 88%, 100% { opacity: 0; transform: translate(0,0); } 89% { opacity: .5; transform: translate(3px,1px); } 90% { opacity: .5; transform: translate(-3px,-1px); } 91% { opacity: .5; transform: translate(2px,0); } 92% { opacity: 0; transform: translate(0,0); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(424px); } }
    @media (prefers-reduced-motion: reduce) {
      .line, .glitchA, .glitchB, .pulse, .blink, .scanline { animation: none; }
      .glitchA, .glitchB { opacity: 0; }
    }
  </style>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <rect width="1200" height="480" fill="url(#matrix)"/>
  <ellipse cx="250" cy="120" rx="430" ry="230" fill="url(#glow)"/>
  <rect width="1200" height="480" fill="url(#vignette)"/>

  <g clip-path="url(#windowClip)">
    <rect x="24" y="24" width="1152" height="432" rx="14" fill="url(#panel)" stroke="#123b2a" stroke-width="1.5"/>
    <path d="M24 38a14 14 0 0 1 14-14h1124a14 14 0 0 1 14 14v24H24z" fill="#08150f"/>
    <line x1="24" y1="62" x2="1176" y2="62" stroke="#123b2a" stroke-width="1"/>

    <rect x="44" y="39" width="8" height="8" rx="1" fill="#ff4d4d" opacity=".9"/>
    <rect x="60" y="39" width="8" height="8" rx="1" fill="#ffb000" opacity=".9"/>
    <rect x="76" y="39" width="8" height="8" rx="1" fill="#00ff9c" opacity=".9"/>
    <text x="100" y="49" class="mono" font-size="12" fill="#7fa394"><tspan fill="#00ff9c">imran@kali</tspan>: ~/profile</text>
    <text x="1156" y="49" class="mono" font-size="10" letter-spacing="1.5" text-anchor="end" fill="#00ff9c" opacity=".8">[ SECURE SHELL ]</text>

    <path d="M42 72V46h26" fill="none" stroke="#00ff9c" stroke-opacity=".38" stroke-width="2"/>
    <path d="M1158 72V46h-26" fill="none" stroke="#00ff9c" stroke-opacity=".38" stroke-width="2"/>
    <path d="M42 408v26h26" fill="none" stroke="#00ff9c" stroke-opacity=".38" stroke-width="2"/>
    <path d="M1158 408v26h-26" fill="none" stroke="#00ff9c" stroke-opacity=".38" stroke-width="2"/>

    <line x1="48" y1="86" x2="48" y2="392" stroke="#123b2a" stroke-width="1"/>
    <line x1="48" y1="86" x2="56" y2="86" stroke="#00ff9c" stroke-opacity=".5" stroke-width="1"/>
    <line x1="48" y1="392" x2="56" y2="392" stroke="#00ff9c" stroke-opacity=".5" stroke-width="1"/>

    <g class="line d1">
      <rect x="72" y="90" width="7" height="7" fill="#00ff9c" class="pulse"/>
      <text x="88" y="98" class="mono" font-size="10" letter-spacing="2" fill="#5f8574">SUBJECT_IDENTIFIED</text>
    </g>

    <g class="line d2">
      <text x="66" y="190" class="name" font-size="100" fill="#e6fff4">IMRAN</text>
      <text x="66" y="282" class="name" font-size="100" fill="#e6fff4">SHAIKH</text>
    </g>

    <g clip-path="url(#gA)" class="glitchA">
      <text x="69" y="190" class="name" font-size="100" fill="#ffb000">IMRAN</text>
    </g>
    <g clip-path="url(#gB)" class="glitchB">
      <text x="63" y="190" class="name" font-size="100" fill="#00ff9c">IMRAN</text>
    </g>
    <g clip-path="url(#gC)" class="glitchA">
      <text x="69" y="282" class="name" font-size="100" fill="#00ff9c">SHAIKH</text>
    </g>
    <g clip-path="url(#gB)" class="glitchB">
      <text x="63" y="282" class="name" font-size="100" fill="#ffb000">SHAIKH</text>
    </g>

    <g class="line d3">
      <text x="70" y="318" class="mono" font-size="13" letter-spacing="2.4" fill="#8fb3a3">PENETRATION TESTER  /  BUG HUNTER</text>
      <text x="70" y="341" class="mono" font-size="11" letter-spacing="1.8" fill="#5f8574">CYBERSECURITY RESEARCHER  /  YOUTUBER</text>
    </g>

    <g class="line d4">
      <rect x="70" y="360" width="64" height="24" rx="2" fill="none" stroke="#1e5a40"/>
      <text x="84" y="376" class="mono" font-size="10" letter-spacing="1" fill="#00ff9c">WEB</text>
      <rect x="142" y="360" width="64" height="24" rx="2" fill="none" stroke="#1e5a40"/>
      <text x="156" y="376" class="mono" font-size="10" letter-spacing="1" fill="#00ff9c">API</text>
      <rect x="214" y="360" width="94" height="24" rx="2" fill="none" stroke="#1e5a40"/>
      <text x="228" y="376" class="mono" font-size="10" letter-spacing="1" fill="#00ff9c">ANDROID</text>
      <rect x="316" y="360" width="106" height="24" rx="2" fill="none" stroke="#1e5a40"/>
      <text x="330" y="376" class="mono" font-size="10" letter-spacing="1" fill="#00ff9c">RED TEAM</text>
    </g>

    <g class="line d5">
      <text x="70" y="407" class="mono" font-size="9" letter-spacing="1" fill="#4a6b5d">EST. 2019</text>
      <text x="160" y="407" class="mono" font-size="9" letter-spacing="1" fill="#4a6b5d">NODE 127.0.0.1</text>
      <text x="294" y="407" class="mono" font-size="9" letter-spacing="1" fill="#4a6b5d">UID 0x407704</text>
    </g>

    <line x1="640" y1="82" x2="640" y2="400" stroke="#123b2a" stroke-width="1"/>

    <g class="line d5">
      <text x="668" y="110" class="mono" font-size="13"><tspan fill="#00ff9c">imran@kali:~$</tspan><tspan fill="#d9f5e8"> whoami</tspan></text>
      <text x="668" y="138" class="mono" font-size="13" fill="#7fa394">Imran Shaikh</text>
    </g>

    <g class="line d6">
      <text x="668" y="182" class="mono" font-size="13"><tspan fill="#00ff9c">imran@kali:~$</tspan><tspan fill="#d9f5e8"> cat role.txt</tspan></text>
      <text x="668" y="210" class="mono" font-size="13" fill="#00ff9c">Penetration Tester · Bug Hunter</text>
      <text x="668" y="234" class="mono" font-size="12" fill="#7fa394">Cybersecurity Researcher · YouTuber</text>
    </g>

    <g class="line d7">
      <text x="668" y="278" class="mono" font-size="13"><tspan fill="#00ff9c">imran@kali:~$</tspan><tspan fill="#d9f5e8"> sudo hire-me</tspan></text>
      <rect x="666" y="288" width="224" height="28" rx="2" fill="#ffb000" fill-opacity=".06" stroke="#ffb000" stroke-opacity=".55"/>
      <text x="680" y="307" class="mono" font-size="12" letter-spacing="2" fill="#ffb000">[ ACCESS GRANTED ]</text>
    </g>

    <g class="line d8">
      <text x="668" y="350" class="mono" font-size="13"><tspan fill="#00ff9c">imran@kali:~$</tspan><tspan fill="#d9f5e8"> tail -f mission.log</tspan></text>
      <text x="668" y="378" class="mono" font-size="12" fill="#00ff9c">breaking things. responsibly.</text>
      <text x="668" y="408" class="mono" font-size="12" fill="#5f8574">root@imran:~#</text>
      <rect x="786" y="396" width="8" height="13" fill="#00ff9c" class="blink"/>
    </g>

    <line x1="24" y1="420" x2="1176" y2="420" stroke="#123b2a" stroke-width="1"/>
    <rect x="24" y="421" width="1152" height="35" fill="#040a07" opacity=".75"/>

    <circle cx="46" cy="438" r="3" fill="#00ff9c" class="pulse"/>
    <text x="56" y="441" class="mono" font-size="9" letter-spacing="1.4" fill="#00ff9c">ONLINE</text>
    <text x="124" y="441" class="mono" font-size="9" letter-spacing="1.4" fill="#4a6b5d">UPTIME 07Y+</text>
    <text x="232" y="441" class="mono" font-size="9" letter-spacing="1.4" fill="#4a6b5d">NODE 127.0.0.1</text>
    <text x="366" y="441" class="mono" font-size="9" letter-spacing="1.4" fill="#4a6b5d">SHELL /bin/zsh</text>
    <text x="1156" y="441" class="mono" font-size="9" letter-spacing="1.4" text-anchor="end" fill="#ffb000" opacity=".8">PGP 0x407704  //  AUTHORIZED ACCESS ONLY</text>

    <rect x="24" y="24" width="1152" height="432" fill="url(#scanlines)" opacity=".5"/>
    <rect x="24" y="24" width="1152" height="2" fill="#00ff9c" opacity=".45" class="scanline"/>
  </g>
</svg>
