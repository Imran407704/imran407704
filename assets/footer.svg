<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="footTitle footDesc">
  <title id="footTitle">Session terminated — Imran Shaikh</title>
  <desc id="footDesc">A terminal footer with a logout sequence and an encrypted padlock.</desc>

  <defs>
    <linearGradient id="fpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08140e"/>
      <stop offset="1" stop-color="#040806"/>
    </linearGradient>
    <pattern id="fscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity=".22"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: "Fira Code", "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Menlo, Consolas, monospace; }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .blink, .pulse { animation: none; } }
  </style>

  <rect x="24" y="16" width="1152" height="144" rx="12" fill="url(#fpanel)" stroke="#123b2a" stroke-width="1.5"/>

  <path d="M42 42V28h24" fill="none" stroke="#00ff9c" stroke-opacity=".35" stroke-width="2"/>
  <path d="M1158 42V28h-24" fill="none" stroke="#00ff9c" stroke-opacity=".35" stroke-width="2"/>

  <text x="52" y="60" class="mono" font-size="13"><tspan fill="#00ff9c">imran@kali:~#</tspan><tspan fill="#d9f5e8"> logout</tspan></text>
  <rect x="224" y="48" width="8" height="14" fill="#00ff9c" class="blink"/>
  <text x="52" y="86" class="mono" font-size="12" fill="#7fa394">Connection to 127.0.0.1 closed.</text>
  <text x="52" y="112" class="mono" font-size="11" letter-spacing="2" fill="#ffb000">[ SESSION TERMINATED ]</text>
  <text x="52" y="140" class="mono" font-size="9" letter-spacing="1.6" fill="#4a6b5d">EOF // 0x407704 // RESPONSIBLE DISCLOSURE ONLY</text>

  <line x1="736" y1="40" x2="736" y2="136" stroke="#123b2a" stroke-width="1"/>

  <g transform="translate(800,48)">
    <rect x="0" y="28" width="64" height="48" rx="5" fill="none" stroke="#00ff9c" stroke-width="2"/>
    <path d="M14 28V16a18 18 0 0 1 36 0v12" fill="none" stroke="#00ff9c" stroke-width="2"/>
    <circle cx="32" cy="50" r="5" fill="#00ff9c"/>
    <path d="M32 55v10" stroke="#00ff9c" stroke-width="2"/>
    <text x="32" y="96" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#5f8574">ENCRYPTED</text>
  </g>

  <text x="908" y="70" class="mono" font-size="13" fill="#8fb3a3">Break. Learn. Report. Repeat.</text>
  <text x="908" y="94" class="mono" font-size="11" fill="#4a6b5d">Authorized targets only.</text>
  <text x="908" y="112" class="mono" font-size="11" fill="#5f8574">Findings disclosed. No systems harmed.</text>

  <rect x="24" y="16" width="1152" height="144" rx="12" fill="url(#fscan)" opacity=".5"/>
</svg>
